[metadata]
name = ysotype
version = attr: ysotype.__version__
description = Spectral type, extinction and veiling of young stellar objects from optical and near-infrared spectra
long_description = file: README.md
long_description_content_type = text/markdown
url = https://github.com/GITHUB_USER/YSOType
author = YOUR NAME
license = MIT
license_files = LICENSE
classifiers =
    Programming Language :: Python :: 3
    License :: OSI Approved :: MIT License
    Intended Audience :: Science/Research
    Topic :: Scientific/Engineering :: Astronomy

[options]
packages = find:
python_requires = >=3.6
install_requires =
    numpy>=1.15
    scipy>=1.1
    matplotlib>=3.1
    astropy>=3.2
include_package_data = True

[options.packages.find]
exclude = tests

[options.package_data]
ysotype = data/*.csv

[options.entry_points]
console_scripts =
    ysotype = ysotype.cli:main

[options.extras_require]
test = pytest
